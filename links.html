<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Done.ai — Landing Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset & Base ── */
      .lp-embed *,
      .lp-embed *::before,
      .lp-embed *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-pearl: #fbfbfb;
        --color-midnight: #0b0425;
        --color-platinum: #f0f0f0;
        --color-violet: #6a00d5;
        --color-lavender: #f4efff;
        --color-text-secondary: #6b6b6b;
        --color-border: rgba(11, 4, 37, 0.08);
        --color-text-primary: #0b0425;
        --color-accent: #6a00d5;

        --text-body: 16px;
        --text-body-small: 14px;
        --text-caption: 12px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 40px;
        --space-6: 56px;
        --space-7: 72px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-full: 9999px;

        --shadow-sm: 0 1px 2px rgba(11, 4, 37, 0.05);
        --shadow-md: 0 4px 12px rgba(11, 4, 37, 0.08);
        --shadow-lg: 0 8px 24px rgba(11, 4, 37, 0.12);

        --duration-fast: 100ms;
        --duration-normal: 200ms;
        --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out: cubic-bezier(0, 0, 0.2, 1);
      }

      .lp-embed {
        font-family: "DM Sans", sans-serif;
        color: var(--color-midnight);
        background-color: var(--color-pearl);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 112px 24px 48px;
      }

      .lp-nav {
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      .lp-nav h1 {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--color-midnight);
        margin-bottom: 40px;
      }

      .lp-links {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .lp-link a {
        display: block;
        font-family: "DM Sans", sans-serif;
        font-size: 17px;
        font-weight: 500;
        color: var(--color-midnight);
        text-decoration: none;
        background-color: var(--color-pearl);
        padding: 20px 24px;
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-md);
        transition: transform var(--duration-normal) var(--ease-default),
          box-shadow var(--duration-normal) var(--ease-default);
      }

      .lp-link a:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }

      .lp-link a:active {
        transform: translateY(0);
      }

      .lp-link a:focus-visible {
        outline: 2px solid var(--color-violet);
        outline-offset: 2px;
      }

      @media (max-width: 600px) {
        .lp-nav h1 {
          font-size: 24px;
        }
        .lp-link a {
          font-size: 16px;
          padding: 16px 20px;
        }
      }

      /* ========================================
         Shared Layout
         ======================================== */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 var(--space-4);
      }

      .header a,
      .footer a {
        text-decoration: none;
        color: inherit;
      }

      /* ========================================
         Buttons
         ======================================== */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "DM Sans", sans-serif;
        font-size: var(--text-body);
        font-weight: 400;
        border-radius: 100px;
        border: none;
        cursor: pointer;
        transition: transform var(--duration-fast) var(--ease-default),
          box-shadow var(--duration-fast) var(--ease-default),
          background var(--duration-fast) var(--ease-default),
          border-color var(--duration-fast) var(--ease-default);
        padding: 16px 40px;
        line-height: 1;
      }
      .btn--sm {
        padding: 10px 24px;
        font-size: var(--text-body-small);
      }

      /* ========================================
         Header
         ======================================== */
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        height: 64px;
        display: flex;
        align-items: center;
        transition: background-color 0.3s var(--ease-default),
          box-shadow 0.3s var(--ease-default);
      }
      .header.scrolled {
        background-color: rgba(11, 4, 37, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 1px 0 rgba(251, 251, 251, 0.06);
      }
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 var(--space-4);
      }
      .header__logo {
        display: flex;
        align-items: center;
        color: var(--color-pearl);
      }
      .header__logo svg {
        height: 28px;
        width: auto;
      }
      .header__nav {
        display: flex;
        align-items: center;
        gap: var(--space-5);
      }
      .header__nav-links {
        display: flex;
        align-items: center;
        gap: var(--space-5);
      }
      .header__link {
        font-size: var(--text-body-small);
        font-weight: 400;
        color: rgba(251, 251, 251, 0.75);
        transition: color var(--duration-fast);
      }
      .header__link:hover {
        color: var(--color-pearl);
      }
      .header__cta {
        margin-left: var(--space-3);
        background: rgba(251, 251, 251, 0.1);
        border: 1px solid rgba(251, 251, 251, 0.25);
        color: var(--color-pearl);
      }
      .header__cta:hover {
        background: rgba(251, 251, 251, 0.15);
        border-color: rgba(251, 251, 251, 0.4);
        transform: none;
        box-shadow: none;
      }
      .header__hamburger {
        display: none;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--color-pearl);
        z-index: 101;
        padding: 0;
      }
      .header__hamburger-icon--close {
        display: none;
      }
      .header__hamburger.is-open .header__hamburger-icon--menu {
        display: none;
      }
      .header__hamburger.is-open .header__hamburger-icon--close {
        display: block;
      }

      /* ========================================
         Footer
         ======================================== */
      .footer {
        background: linear-gradient(
          170deg,
          #0b0425 0%,
          #1a0e3a 40%,
          #0b0425 75%,
          #0e0830 100%
        );
        color: var(--color-pearl);
        padding: var(--space-7) 0 var(--space-5);
        position: relative;
        overflow: hidden;
      }
      .footer::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            ellipse at 50% 0%,
            rgba(106, 0, 213, 0.1) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 50% 100%,
            rgba(106, 0, 213, 0.06) 0%,
            transparent 50%
          );
        pointer-events: none;
      }
      .footer::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(251, 251, 251, 0.06) 1px,
          transparent 1px
        );
        background-size: 40px 40px;
        pointer-events: none;
      }
      .footer > .container {
        position: relative;
        z-index: 1;
      }
      .footer__inner {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr;
        gap: var(--space-5);
      }
      .footer__brand {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .footer__logo {
        color: var(--color-pearl);
      }
      .footer__logo svg {
        height: 32px;
        width: auto;
      }
      .footer__col-title {
        font-size: var(--text-body-small);
        font-weight: 500;
        margin-bottom: var(--space-4);
        color: rgba(251, 251, 251, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .footer__links {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .footer__link {
        font-size: var(--text-body-small);
        color: rgba(251, 251, 251, 0.6);
        transition: color var(--duration-fast);
      }
      .footer__link:hover {
        color: var(--color-pearl);
      }
      .footer__company-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: var(--text-body-small);
        color: rgba(251, 251, 251, 0.45);
        line-height: 1.5;
      }
      .footer__socials {
        display: flex;
        gap: var(--space-3);
        margin-top: var(--space-4);
      }
      .footer__social-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
        color: rgba(251, 251, 251, 0.4);
        transition: color var(--duration-fast) var(--ease-default),
          background var(--duration-fast) var(--ease-default);
      }
      .footer__social-icon:hover {
        color: var(--color-pearl);
        background: rgba(251, 251, 251, 0.06);
      }
      .footer__social-icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.5;
        fill: none;
      }
      .footer__divider {
        border: none;
        border-top: 1px solid rgba(251, 251, 251, 0.06);
        margin: var(--space-6) 0 var(--space-4);
      }
      .footer__bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: rgba(251, 251, 251, 0.35);
        gap: var(--space-4);
        flex-wrap: wrap;
      }
      .footer__legal {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .footer__legal-sep {
        margin: 0 4px;
      }

      /* ========================================
         Responsive — Header/Footer Tablet
         ======================================== */
      @media (max-width: 1024px) {
        .header__nav {
          gap: var(--space-4);
        }
        .header__nav-links {
          gap: var(--space-4);
        }
        .footer__inner {
          grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .footer__brand {
          grid-column: 1 / -1;
        }
      }

      /* ========================================
         Responsive — Header/Footer Mobile
         ======================================== */
      @media (max-width: 768px) {
        .header__hamburger {
          display: flex;
        }
        .header__nav-links {
          display: none;
          position: fixed;
          top: 64px;
          left: 0;
          right: 0;
          background: rgba(11, 4, 37, 0.97);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          flex-direction: column;
          padding: 24px;
          gap: 20px;
          border-bottom: 1px solid rgba(251, 251, 251, 0.06);
        }
        .header__nav-links.is-open {
          display: flex;
        }
        .header__nav-links .header__link {
          font-size: 16px;
          color: rgba(251, 251, 251, 0.8);
        }
        .header__nav-links .header__cta {
          margin-left: 0;
          margin-top: var(--space-2);
        }
        .header__nav {
          gap: var(--space-3);
        }
        .footer__inner {
          grid-template-columns: 1fr 1fr;
        }
        .footer__bottom {
          flex-direction: column;
          align-items: flex-start;
          gap: var(--space-2);
        }
      }

      @media (max-width: 480px) {
        .footer__inner {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="lp-embed">
      <nav class="lp-nav">
        <h1>Landing Pages</h1>
        <ul class="lp-links">
          <li class="lp-link">
            <a href="marketing.html">Marketing</a>
          </li>
          <li class="lp-link">
            <a href="accounting.html">Accounting</a>
          </li>
          <li class="lp-link">
            <a href="partners.html">Partners</a>
          </li>
          <li class="lp-link">
            <a href="our-companies.html">Companies</a>
          </li>
          <li class="lp-link"><a href="mrp.html">MRP</a></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
